<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ATR 매매 계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h1{font-size:24px;margin:0 0 6px}.sub{font-size:13px;color:#666;margin-bottom:18px}
h2{font-size:18px;margin:0 0 14px}
.grid,.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input{width:100%;height:46px;padding:10px 12px;border:1px solid #d9dde2;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;height:50px;margin-top:14px;border:0;border-radius:11px;background:#111;color:#fff;font-size:17px;font-weight:800}
.stock{font-size:21px;font-weight:800;margin-bottom:14px}
.box{background:#f6f7f9;border-radius:12px;padding:13px;min-height:76px}
.t{font-size:12px;color:#666}.v{font-size:19px;font-weight:800;margin-top:5px}.big{font-size:23px}
.note{font-size:12px;color:#666;line-height:1.65;margin:12px 0 0}
@media(max-width:520px){.grid,.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<section class="card">
<h1>ATR 매매 계산기</h1>
<div class="sub">1회 매수 · -1.5 ATR 50% 손절 · 11봉 저점 · ATR×2 트레일링스탑</div>

<div class="grid">
<div><label>종목명</label><input id="stock" value="삼성전자"></div>
<div><label>투자금 (만원)</label><input id="capital" type="number" value="1000" min="0"></div>
<div><label>매수가</label><input id="buy" type="number" value="10000" min="0"></div>
<div><label>ATR</label><input id="atr" type="number" value="500" min="0"></div>
<div><label>11봉 스윙 저점</label><input id="swing" type="number" value="9500" min="0"></div>
<div><label>최고가</label><input id="high" type="number" value="13000" min="0"></div>
<div><label>ATR 트레일링 배수</label><input id="multiple" type="number" value="2" min="0" step="0.1"></div>
</div>
<button id="calc" type="button">계산하기</button>
</section>

<section class="card">
<div id="resultStock" class="stock">삼성전자</div>
<div class="results">
<div class="box"><div class="t">투자금</div><div id="resultCapital" class="v"></div></div>
<div class="box"><div class="t">매수 수량</div><div id="resultShares" class="v"></div></div>
<div class="box"><div class="t">평균매수가</div><div id="resultAvg" class="v big"></div></div>
<div class="box"><div class="t">매수금액</div><div id="resultAmount" class="v"></div></div>
</div>
</section>

<section class="card">
<h2>50% 매도 기준</h2>
<div class="results">
<div class="box"><div class="t">-1.5 ATR 가격</div><div id="resultStop" class="v big"></div></div>
<div class="box"><div class="t">11봉 스윙 저점</div><div id="resultSwing" class="v big"></div></div>
</div>
<p class="note">11봉 저점은 해당 스윙 저점의 최저가(Low)이며, 저점 이탈은 종가 기준으로 판단합니다. 두 조건 중 먼저 발생한 조건에서 50% 매도합니다.</p>
</section>

<section class="card">
<h2>수익 보호</h2>
<div class="results">
<div class="box"><div class="t">ATR 트레일링스탑</div><div id="resultTrail" class="v big"></div></div>
<div class="box"><div class="t">적용 ATR 배수</div><div id="resultMultiple" class="v"></div></div>
</div>
<p class="note">트레일링스탑 = 최고가 − (ATR × 배수)</p>
</section>

</div>

<script>
(function(){
  function n(id){
    var x=Number(document.getElementById(id).value);
    return Number.isFinite(x)?x:0;
  }
  function won(x){
    return new Intl.NumberFormat("ko-KR",{maximumFractionDigits:0}).format(x)+"원";
  }
  function shares(x){
    return new Intl.NumberFormat("ko-KR",{maximumFractionDigits:4}).format(x)+"주";
  }

  function calculate(){
    var stock=document.getElementById("stock").value.trim()||"종목명 없음";
    var capital=n("capital")*10000;
    var buy=n("buy");
    var atr=n("atr");
    var swing=n("swing");
    var high=n("high");
    var multiple=n("multiple");

    if(buy<=0){
      alert("매수가를 입력해 주세요.");
      return;
    }

    var qty=capital/buy;
    var stop=buy-(atr*1.5);
    var trail=high-(atr*multiple);

    /* 계산 버튼을 누를 때마다 아래 모든 결과를 새 값으로 갱신 */
    document.getElementById("resultStock").textContent=stock;
    document.getElementById("resultCapital").textContent=won(capital);
    document.getElementById("resultShares").textContent=shares(qty);
    document.getElementById("resultAvg").textContent=won(buy);
    document.getElementById("resultAmount").textContent=won(capital);

    document.getElementById("resultStop").textContent=won(stop);
    document.getElementById("resultSwing").textContent=won(swing);

    document.getElementById("resultTrail").textContent=won(trail);
    document.getElementById("resultMultiple").textContent=multiple+" × ATR";
  }

  document.getElementById("calc").addEventListener("click",calculate);
  document.querySelectorAll("input").forEach(function(el){
    el.addEventListener("keydown",function(e){
      if(e.key==="Enter") calculate();
    });
  });

  calculate();
})();
</script>
</body>
</html>
